<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Filippo Bartolotta AI</title>

  <!-- Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f4f4f4;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 20px;
      background: white;
      border-bottom: 1px solid #e0e0e0;
      font-weight: 600;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 70%;
      padding: 14px 18px;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 15px;
      white-space: normal;
    }

    .user {
      align-self: flex-end;
      background: #111;
      color: white;
    }

    .bot {
      align-self: flex-start;
      background: white;
      border: 1px solid #ddd;
    }

    #inputArea {
      display: flex;
      padding: 16px;
      background: white;
      border-top: 1px solid #ddd;
    }

    textarea {
      flex: 1;
      resize: none;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      margin-left: 10px;
      padding: 10px 16px;
      background: black;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

<header>
  Filippo Bartolotta AI
</header>

<div id="chat"></div>

<div id="inputArea">
  <textarea id="input" rows="2" placeholder="Ask about wine, regions, or travel..."></textarea>
  <button onclick="send()" id="sendBtn">Send</button>
</div>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");

  let messages = [];

  function addMessage(text, role) {
    const div = document.createElement("div");
    div.classList.add("message", role);

    if (role === "bot") {
      div.innerHTML = marked.parse(text);
    } else {
      div.textContent = text;
    }

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    messages.push({ role: "user", content: text });

    input.value = "";
    sendBtn.disabled = true;

    const loadingDiv = document.createElement("div");
    loadingDiv.classList.add("message", "bot");
    loadingDiv.textContent = "Thinking...";
    chat.appendChild(loadingDiv);
    chat.scrollTop = chat.scrollHeight;

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages })
      });

      const data = await res.json();

      chat.removeChild(loadingDiv);

      addMessage(data.reply, "bot");
      messages.push({ role: "assistant", content: data.reply });

    } catch (error) {
      chat.removeChild(loadingDiv);
      addMessage("Error connecting to the server.", "bot");
    }

    sendBtn.disabled = false;
  }
</script>

</body>
</html>
