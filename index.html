<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Filippo Bartolotta AI</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  background: #F5F1E8;
  color: #2A2A2A;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* HEADER */

header {
  padding: 30px 50px 20px 50px;
  background: #F5F1E8;
  display: flex;
  align-items: center;
  position: relative;
}

.logo {
  height: 56px;
  opacity: 0;
  transform: translateY(6px);
  animation: fadeIn 0.7s ease-out forwards;
}

@keyframes fadeIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* micro line */

header::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 50px;
  right: 50px;
  height: 1px;
  background: #5B1F2A;
  opacity: 0.25;
}

/* INTRO */

.intro {
  padding: 30px 50px 10px 50px;
  max-width: 780px;
}

.intro h1 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 500;
  font-size: 28px;
  color: #5B1F2A;
  margin-bottom: 6px;
}

.intro h2 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: 20px;
  color: #5B1F2A;
  opacity: 0.75;
  margin-top: 0;
  margin-bottom: 14px;
}

.intro p {
  font-family: Georgia, serif;
  font-size: 15px;
  line-height: 1.7;
  color: #6D6D6D;
  margin: 0;
}

/* CHAT */

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 30px 50px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.message {
  max-width: 700px;
  padding: 18px 22px;
  border-radius: 12px;
  line-height: 1.7;
  font-size: 16px;
  opacity: 0;
  transform: translateY(8px);
  animation: messageAppear 0.35s ease forwards;
}

@keyframes messageAppear {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.user {
  align-self: flex-end;
  background: #5B1F2A;
  color: white;
  font-family: -apple-system, sans-serif;
  font-size: 14px;
}

.bot {
  align-self: flex-start;
  background: white;
  border: 1px solid rgba(0,0,0,0.08);
  font-family: Georgia, serif;
}

/* INPUT */

#inputArea {
  display: flex;
  padding: 25px 50px;
  background: #F5F1E8;
  border-top: 1px solid rgba(0,0,0,0.05);
}

textarea {
  flex: 1;
  resize: none;
  padding: 14px;
  font-size: 14px;
  border: 1px solid rgba(0,0,0,0.12);
  border-radius: 8px;
  font-family: -apple-system, sans-serif;
  background: white;
}

button {
  margin-left: 14px;
  padding: 14px 22px;
  background: #5B1F2A;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: opacity 0.25s ease;
}

button:hover {
  opacity: 0.85;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

</style>
</head>

<body>

<header>
  <img src="logo.png" class="logo">
</header>

<div class="intro">
  <h1>Ask Filippo</h1>
  <h2>Chiedi a Filippo</h2>
  <p>
    Conversazioni sul vino, territori e cultura enologica.
    <br>
    Conversations about wine, regions and curated travel experiences.
  </p>
</div>

<div id="chat"></div>

<div id="inputArea">
  <textarea id="input" rows="2" placeholder="Ask about wine, regions, or travel..."></textarea>
  <button onclick="send()" id="sendBtn">Send</button>
</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");

let messages = [];

function addMessage(text, role) {
  const div = document.createElement("div");
  div.classList.add("message", role);

  if (role === "bot") {
    div.innerHTML = marked.parse(text);
  } else {
    div.textContent = text;
  }

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  messages.push({ role: "user", content: text });

  input.value = "";
  sendBtn.disabled = true;

  const loading = document.createElement("div");
  loading.classList.add("message", "bot");
  loading.textContent = "…";
  chat.appendChild(loading);

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages })
    });

    const data = await res.json();
    chat.removeChild(loading);

    addMessage(data.reply, "bot");
    messages.push({ role: "assistant", content: data.reply });

  } catch (err) {
    chat.removeChild(loading);
    addMessage("Connection error.", "bot");
  }

  sendBtn.disabled = false;
}

</script>

</body>
</html>
