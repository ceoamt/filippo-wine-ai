<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Filippo Bartolotta AI</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

body {
  margin: 0;
  font-family: "Georgia", serif;
  background: #F5F1E8;
  color: #2A2A2A;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* HEADER */

header {
  padding: 28px 40px;
  display: flex;
  align-items: center;
  border-bottom: 1px solid rgba(0,0,0,0.05);
  background: #F5F1E8;
}

.logo {
  height: 54px;
  opacity: 0;
  transform: translateY(8px);
  animation: fadeIn 0.6s ease-out forwards;
}

@keyframes fadeIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* INTRO */

.intro {
  padding: 20px 40px 0 40px;
  max-width: 760px;
}

.intro h1 {
  font-weight: 500;
  font-size: 20px;
  color: #5B1F2A;
  margin-bottom: 8px;
}

.intro p {
  margin: 0;
  font-size: 14px;
  color: #8A8A8A;
  line-height: 1.6;
}

/* CHAT */

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 30px 40px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.message {
  max-width: 680px;
  padding: 16px 20px;
  border-radius: 14px;
  line-height: 1.6;
  font-size: 15px;
}

.user {
  align-self: flex-end;
  background: #5B1F2A;
  color: white;
  font-family: -apple-system, sans-serif;
}

.bot {
  align-self: flex-start;
  background: white;
  border: 1px solid rgba(0,0,0,0.08);
}

/* INPUT */

#inputArea {
  display: flex;
  padding: 20px 40px;
  background: #F5F1E8;
  border-top: 1px solid rgba(0,0,0,0.05);
}

textarea {
  flex: 1;
  resize: none;
  padding: 12px;
  font-size: 14px;
  border: 1px solid rgba(0,0,0,0.1);
  border-radius: 8px;
  font-family: -apple-system, sans-serif;
}

button {
  margin-left: 12px;
  padding: 12px 20px;
  background: #5B1F2A;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: opacity 0.3s ease;
}

button:hover {
  opacity: 0.85;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

</style>
</head>

<body>

<header>
  <img src="logo.png" class="logo">
</header>

<div class="intro">
  <h1>Ask about wine and travel</h1>
  <p>
    Conversazioni sul vino, territori e cultura enologica.<br>
    Conversations about wine, regions and curated travel experiences.
  </p>
</div>

<div id="chat"></div>

<div id="inputArea">
  <textarea id="input" rows="2" placeholder="Ask Filippo..."></textarea>
  <button onclick="send()" id="sendBtn">Send</button>
</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");

let messages = [];

function addMessage(text, role) {
  const div = document.createElement("div");
  div.classList.add("message", role);

  if (role === "bot") {
    div.innerHTML = marked.parse(text);
  } else {
    div.textContent = text;
  }

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  messages.push({ role: "user", content: text });

  input.value = "";
  sendBtn.disabled = true;

  const loading = document.createElement("div");
  loading.classList.add("message", "bot");
  loading.textContent = "Thinking...";
  chat.appendChild(loading);

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages })
    });

    const data = await res.json();
    chat.removeChild(loading);

    addMessage(data.reply, "bot");
    messages.push({ role: "assistant", content: data.reply });

  } catch (err) {
    chat.removeChild(loading);
    addMessage("Connection error.", "bot");
  }

  sendBtn.disabled = false;
}

</script>

</body>
</html>
