<!DOCTYPE html>
<html>
<head>
  <title>Filippo Bartolotta AI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 20px;
      background: white;
      border-bottom: 1px solid #ddd;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .user {
      align-self: flex-end;
      background: #111;
      color: white;
    }

    .bot {
      align-self: flex-start;
      background: white;
      border: 1px solid #ddd;
    }

    #inputArea {
      display: flex;
      padding: 16px;
      background: white;
      border-top: 1px solid #ddd;
    }

    textarea {
      flex: 1;
      resize: none;
      padding: 10px;
      font-size: 14px;
    }

    button {
      margin-left: 10px;
      padding: 10px 16px;
      background: black;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

<header>
  Filippo Bartolotta AI
</header>

<div id="chat"></div>

<div id="inputArea">
  <textarea id="input" rows="2" placeholder="Ask Filippo about wine or travel..."></textarea>
  <button onclick="send()" id="sendBtn">Send</button>
</div>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");

  let messages = [];

  function addMessage(text, role) {
    const div = document.createElement("div");
    div.classList.add("message", role);
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    messages.push({ role: "user", content: text });

    input.value = "";
    sendBtn.disabled = true;

    addMessage("Thinking...", "bot");

    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages })
    });

    const data = await res.json();

    chat.removeChild(chat.lastChild);

    addMessage(data.reply, "bot");
    messages.push({ role: "assistant", content: data.reply });

    sendBtn.disabled = false;
  }
</script>

</body>
</html>
