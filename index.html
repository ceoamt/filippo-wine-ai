<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Filippo Bartolotta</title>

  <!-- Google Font elegante -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #f7f6f4;
      font-family: 'Inter', sans-serif;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 28px 40px;
      border-bottom: 1px solid #e8e6e3;
      background: #f7f6f4;
      display: flex;
      flex-direction: column;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      margin: 0;
      letter-spacing: 0.5px;
    }

    header span {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.6;
      margin-top: 4px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .message {
      max-width: 720px;
      line-height: 1.7;
      font-size: 16px;
    }

    .user {
      align-self: flex-end;
      background: #1a1a1a;
      color: white;
      padding: 14px 20px;
      border-radius: 24px;
      max-width: 60%;
    }

    .bot {
      align-self: flex-start;
      padding: 0;
    }

    .bot p {
      margin: 0 0 12px 0;
    }

    #inputArea {
      padding: 30px 40px;
      border-top: 1px solid #e8e6e3;
      background: #f7f6f4;
      display: flex;
      gap: 16px;
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      background: white;
      padding: 16px;
      font-size: 15px;
      border-radius: 12px;
      outline: none;
      font-family: 'Inter', sans-serif;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    button {
      background: #1a1a1a;
      color: white;
      border: none;
      padding: 0 24px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      opacity: 0.85;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

  </style>
</head>

<body>

<header>
  <h1>Filippo Bartolotta</h1>
  <span>Wine & Travel</span>
</header>

<div id="chat"></div>

<div id="inputArea">
  <textarea id="input" rows="2" placeholder="Ask about wine, regions, travel experiences..."></textarea>
  <button onclick="send()" id="sendBtn">Ask</button>
</div>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");

  let messages = [];

  function addMessage(text, role) {
    const div = document.createElement("div");
    div.classList.add("message", role);

    if (role === "bot") {
      div.innerHTML = marked.parse(text);
    } else {
      div.textContent = text;
    }

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    messages.push({ role: "user", content: text });

    input.value = "";
    sendBtn.disabled = true;

    const loadingDiv = document.createElement("div");
    loadingDiv.classList.add("message", "bot");
    loadingDiv.textContent = "Thinking...";
    chat.appendChild(loadingDiv);
    chat.scrollTop = chat.scrollHeight;

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages })
      });

      const data = await res.json();

      chat.removeChild(loadingDiv);

      addMessage(data.reply, "bot");
      messages.push({ role: "assistant", content: data.reply });

    } catch (error) {
      chat.removeChild(loadingDiv);
      addMessage("There was an error connecting to the server.", "bot");
    }

    sendBtn.disabled = false;
  }
</script>

</body>
</html>
