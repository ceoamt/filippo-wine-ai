<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filippo Bartolotta AI</title>

<!-- Markdown parser -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

body {
  margin: 0;
  font-family: "Georgia", serif;
  background: #F5F1E8;
  color: #2A2A2A;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* ================= HEADER ================= */

header {
  padding: 28px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #F5F1E8;
  position: relative;
  animation: headerFade 0.6s ease-out;
}

@keyframes headerFade {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

header::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 40px;
  width: 60px;
  height: 1px;
  background: #5B1F2A;
  opacity: 0.35;
}

.logo {
  height: 54px;
  animation: fadeIn 0.6s ease-out forwards;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.header-right {
  display: flex;
  gap: 22px;
  align-items: center;
}

.icon-link {
  color: #5B1F2A;
  text-decoration: none;
  opacity: 0.65;
  position: relative;
  transition: all 0.3s ease;
}

.icon-link:hover {
  opacity: 1;
  transform: translateY(-2px);
}

.icon {
  width: 20px;
  height: 20px;
}

/* Tooltip */

.icon-link::after {
  content: attr(data-tooltip);
  position: absolute;
  bottom: -28px;
  left: 50%;
  transform: translateX(-50%) translateY(4px);
  font-size: 11px;
  font-family: -apple-system, sans-serif;
  background: #5B1F2A;
  color: white;
  padding: 4px 8px;
  border-radius: 4px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.icon-link:hover::after {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ================= INTRO ================= */

.intro {
  padding: 24px 40px 0 40px;
  max-width: 760px;
}

.intro h1 {
  font-weight: 500;
  font-size: 20px;
  color: #5B1F2A;
  margin-bottom: 6px;
}

.intro p {
  margin: 0;
  font-size: 14px;
  color: #8A8A8A;
  line-height: 1.6;
}

/* ================= CHAT ================= */

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 30px 40px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.message {
  max-width: 680px;
  padding: 18px 22px;
  border-radius: 14px;
  line-height: 1.65;
  font-size: 15px;
  animation: fadeMessage 0.3s ease-out;
}

@keyframes fadeMessage {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.user {
  align-self: flex-end;
  background: #5B1F2A;
  color: white;
  font-family: -apple-system, sans-serif;
  font-size: 14px;
}

.bot {
  align-self: flex-start;
  background: white;
  border: 1px solid rgba(0,0,0,0.08);
  position: relative;
}

.bot::before {
  content: "";
  position: absolute;
  top: 12px;
  left: -12px;
  width: 3px;
  height: 40%;
  background: #5B1F2A;
  opacity: 0.35;
}

/* Markdown styling */

.bot p {
  margin-bottom: 12px;
}

.bot strong {
  font-weight: 600;
}

.bot ul, .bot ol {
  margin-left: 20px;
  margin-bottom: 14px;
}

.bot li {
  margin-bottom: 6px;
}

/* ================= INPUT ================= */

#inputArea {
  display: flex;
  padding: 20px 40px;
  background: #F5F1E8;
  border-top: 1px solid rgba(0,0,0,0.05);
}

textarea {
  flex: 1;
  resize: none;
  padding: 12px;
  font-size: 14px;
  border: 1px solid rgba(0,0,0,0.1);
  border-radius: 8px;
  font-family: -apple-system, sans-serif;
}

button {
  margin-left: 12px;
  padding: 12px 20px;
  background: #5B1F2A;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: opacity 0.3s ease;
}

button:hover {
  opacity: 0.85;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

</style>
</head>

<body>

<header>

  <img src="logo.png" class="logo">

  <div class="header-right">
    <!-- Icons unchanged -->
  </div>

</header>

<div class="intro">
  <h1 id="title"></h1>
  <p id="subtitle"></p>
</div>

<div id="chat"></div>

<div id="inputArea">
  <textarea id="input" rows="2"></textarea>
  <button onclick="send()" id="sendBtn"></button>
</div>

<script>

/* ================= UI LANGUAGE ================= */

const userLang = navigator.language || navigator.userLanguage;
const lang = userLang.startsWith("it") ? "it" : "en";

const translations = {
  it: {
    title: "Chiedi a Filippo",
    subtitle: "Conversazioni su vino, territori ed esperienze enologiche.",
    placeholder: "Scrivi una domanda su vino o viaggi...",
    send: "Invia",
    loading: "Sto rispondendo…",
    error: "Errore di connessione."
  },
  en: {
    title: "Ask Filippo",
    subtitle: "Conversations about wine, regions and curated experiences.",
    placeholder: "Ask about wine or travel...",
    send: "Send",
    loading: "Writing…",
    error: "Connection error."
  }
};

document.getElementById("title").textContent = translations[lang].title;
document.getElementById("subtitle").textContent = translations[lang].subtitle;
document.getElementById("input").placeholder = translations[lang].placeholder;
document.getElementById("sendBtn").textContent = translations[lang].send;

/* ================= CHAT ================= */

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");

let messages = [];

function addMessage(text, role) {
  const div = document.createElement("div");
  div.classList.add("message", role);

  if (role === "bot") {
    div.innerHTML = marked.parse(text);
  } else {
    div.textContent = text;
  }

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  messages.push({ role: "user", content: text });

  input.value = "";
  sendBtn.disabled = true;

  const loading = document.createElement("div");
  loading.classList.add("message", "bot");
  loading.textContent = translations[lang].loading;
  chat.appendChild(loading);

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages })
    });

    const data = await res.json();
    chat.removeChild(loading);

    addMessage(data.reply, "bot");
    messages.push({ role: "assistant", content: data.reply });

  } catch (err) {
    chat.removeChild(loading);
    addMessage(translations[lang].error, "bot");
  }

  sendBtn.disabled = false;
}

</script>

</body>
</html>
